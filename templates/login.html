<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Chía Traffic Lights</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
{% with active = "login" %}{% include "_nav.html" %}{% endwith %}

<main class="login-wrap">
  <div class="login-card">
    <div class="tl-mini" aria-hidden="true">
      <span style="background:var(--stop)"></span><span style="background:var(--wait)"></span><span style="background:var(--go)"></span>
    </div>
    <h1 class="h4 mb-1">Log in</h1>
    <p class="small text-secondary mb-4">The dashboard and the simulation are available to the project team.</p>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label class="form-label small" for="username">Username</label>
        <input class="form-control" id="username" name="username" value="{{ username }}" required autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label small" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-dark w-100" type="submit">Log in</button>
    </form>
    <a class="d-block text-center small mt-3" href="/">Back to Home</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
