<nav class="navbar navbar-expand-lg app-nav">
  <div class="container">
    <a class="navbar-brand" href="/">Chía Traffic Lights</a>
    <div class="navbar-nav ms-auto flex-row flex-wrap gap-3">
      <a class="nav-link{% if active == 'home' %} active{% endif %}" href="/">Home</a>
      <div class="nav-item dropdown">
        <a class="nav-link dropdown-toggle{% if active == 'crisp' %} active{% endif %}" href="/crisp-ml" role="button" data-bs-toggle="dropdown" aria-expanded="false">CRISP-ML</a>
        <ul class="dropdown-menu dropdown-menu-end crisp-menu">
          <li><a class="dropdown-item" href="/crisp-ml">Overview</a></li>
          <li><hr class="dropdown-divider"></li>
          {% for p in crisp_phases %}
          <li><a class="dropdown-item{% if phase and phase.num == p.num %} active{% endif %}" href="/crisp-ml/{{ p.num }}"><span class="dot" style="background:{{ p.color }}"></span>Phase {{ p.num }} · {{ p.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
      <a class="nav-link{% if active == 'dashboard' %} active{% endif %}" href="/dashboard">Dashboard</a>
      <a class="nav-link{% if active == 'simula' %} active{% endif %}" href="/simula">Simulation</a>
      {% if session.get("user") %}
      <span class="nav-user">{{ session["user"] }}</span>
      <a class="nav-link" href="/logout">Log out</a>
      {% else %}
      <a class="nav-link nav-login{% if active == 'login' %} active{% endif %}" href="/login">Log in</a>
      {% endif %}
    </div>
  </div>
</nav>
